# Deploys main to the site root and the test branch to /test/
name: Deploy Pages
on:
  push:
    branches: [main, test]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build site (main at /, test at /test/)
        run: |
          set -e
          mkdir -p _site/test
          git archive origin/main | tar -x -C _site
          if git rev-parse --verify -q origin/test >/dev/null; then
            git archive origin/test | tar -x -C _site/test
            sed -i 's#<title>#<title>[TEST] #' _site/test/index.html
          fi
          rm -rf _site/.github _site/test/.github _site/test/test
          # version.json + build id per site (each branch has its own commit id)
          stamp() { # $1 = dir, $2 = ref
            v=$(git rev-parse --short=10 "$2")
            sed -i "s/__BUILD__/$v/" "$1/index.html"
            # newest changelog heading of that ref: the page shows everything above it as "what is new"
            rel=$(git show "$2:CHANGELOG.md" 2>/dev/null | grep -m1 '^## ' | sed 's/^## //' | tr -d '&#/\\' || true)
            sed -i "s#__REL__#$rel#" "$1/index.html"
            printf '{"version":"%s"}\n' "$v" > "$1/version.json"
          }
          stamp _site origin/main
          if [ -d _site/test ] && [ -f _site/test/index.html ]; then stamp _site/test origin/test; fi
          cat _site/version.json _site/test/version.json 2>/dev/null || true
          # guard: a page that has the update check must have a real build id and a version.json
          for d in _site _site/test; do
            [ -f "$d/index.html" ] || continue
            if grep -q '__REL__\|__BUILD__' "$d/index.html"; then echo "::error::$d still has a __REL__ / __BUILD__ placeholder"; exit 1; fi
            # old single-file layout: const BUILD="..." in index.html; new layout: window.__OF={build:"...",rel:"..."} in index.html
            if grep -q 'const BUILD=\|window.__OF' "$d/index.html"; then
              grep -q 'const BUILD="[0-9a-f]\{10\}"\|build:"[0-9a-f]\{10\}"' "$d/index.html" && [ -f "$d/version.json" ] || { echo "::error::$d has no build id / version.json"; exit 1; }
            fi
          done
          ls -R _site | head -30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  # Separate job, as in GitHub's own Pages template: the deploy step reads the artifact list of the run, and in the same job as the upload it found 0 artifacts right after a successful upload.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
