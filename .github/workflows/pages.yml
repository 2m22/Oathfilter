# Deploys main to the site root and the test branch to /test/
name: Deploy Pages
on:
  push:
    branches: [main, test]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build site (main at /, test at /test/)
        run: |
          set -e
          mkdir -p _site/test
          git archive origin/main | tar -x -C _site
          if git rev-parse --verify -q origin/test >/dev/null; then
            git archive origin/test | tar -x -C _site/test
            sed -i 's#<title>#<title>[TEST] #' _site/test/index.html
          fi
          rm -rf _site/.github _site/test/.github _site/test/test
          ls -R _site | head -30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
